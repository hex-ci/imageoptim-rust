[workspace]
members = ["crates/core", "crates/app", "crates/pngquant"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["Hex <hex@codeigniter.org.cn>", "ImageOptim-Rust contributors"]
repository = "https://github.com/hex-ci/imageoptim-rust"

[workspace.dependencies]
libc = "0.2"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md-5 = "0.10"
filetime = "0.2"
walkdir = "2.5"
rusqlite = { version = "0.40", features = ["bundled"] }
directories = "6.0"

oxipng = { version = "10.2", default-features = false, features = ["parallel", "zopfli"] }
zopfli = "0.8"
turbojpeg = "1.5"
img-parts = "0.4"
imagequant = "4.4"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
svgcleaner = { version = "0.9.5", default-features = false }

eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
    "wayland",
    "x11",
] }
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }
egui_extras = "0.37.0"
rfd = "0.17"
open = "5.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
