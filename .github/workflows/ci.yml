name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      IMAGEOPTIM_REQUIRE_EXTERNAL_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ runner.os }}

      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          command -v cmake >/dev/null 2>&1 || brew install cmake
          command -v nasm >/dev/null 2>&1 || brew install nasm

      - name: Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --no-progress -y
          }
          $NasmDir = "${env:ProgramFiles}\NASM"
          if (Test-Path (Join-Path $NasmDir "nasm.exe")) {
            $NasmDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            nasm \
            pkg-config \
            libasound2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libudev-dev \
            libgtk-3-dev \
            libx11-dev \
            dpkg

      - name: Shell script syntax check
        if: runner.os != 'Windows'
        run: sh -n scripts/*.sh

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

      - name: Run test suite
        run: cargo test --workspace

      - name: Release build & package smoke (macOS)
        if: runner.os == 'macOS'
        run: |
          ./scripts/package-macos.sh release
          plutil -lint \
            dist/ImageOptim-Rust.app/Contents/Info.plist \
            dist/ImageOptim-Rust.app/Contents/PlugIns/ImageOptimize.appex/Contents/Info.plist
          test ! -e dist/ImageOptim-Rust.app/Contents/Resources/tools/pngout
          ./dist/ImageOptim-Rust.app/Contents/MacOS/ImageOptim-Rust --version

      - name: Release build & package smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          ./scripts/package-linux.sh release
          test -f dist/ImageOptim-Rust-*.tar.gz
          test -f dist/imageoptim-rust_*.deb
          test ! -e dist/ImageOptim-Rust.AppDir/usr/lib/imageoptim-rust/tools/pngout
          dpkg-deb --info dist/imageoptim-rust_*.deb
          ./dist/ImageOptim-Rust.AppDir/usr/bin/imageoptim-rust --version

      - name: Release build & package smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -Profile release
          Get-Item dist\ImageOptim-Rust-*.zip
          $Pngout = Test-Path dist\ImageOptim-Rust-windows-*\tools\pngout.exe
          if ($Pngout) { throw "pngout.exe must not be bundled in public builds" }
          & .\dist\ImageOptim-Rust-windows-x64\ImageOptim-Rust.exe --version

  qa-smoke-macos:
    name: macOS UI Interaction Smoke
    # Non-intrusive interaction regression: quiet mode + in-process egui input
    # injection with assertions (no focus/cursor side effects on the runner).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: qa-${{ runner.os }}

      - name: macOS build dependencies
        run: |
          command -v cmake >/dev/null 2>&1 || brew install cmake
          command -v nasm >/dev/null 2>&1 || brew install nasm

      - name: Build workspace
        run: cargo build --workspace

      - name: Interaction smoke (asserted)
        run: ./scripts/qa-smoke.sh target/debug/ImageOptim-Rust
